<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Validador XLSX - CIDI Auto-Notas</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 40px 20px;
    }
    
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      padding: 40px;
    }
    
    h1 {
      color: #2d3748;
      font-size: 28px;
      margin-bottom: 10px;
      text-align: center;
    }
    
    .subtitle {
      text-align: center;
      color: #718096;
      font-size: 14px;
      margin-bottom: 30px;
    }
    
    .upload-area {
      border: 3px dashed #cbd5e0;
      border-radius: 8px;
      padding: 40px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
      margin-bottom: 30px;
    }
    
    .upload-area:hover {
      border-color: #667eea;
      background: #f7fafc;
    }
    
    .upload-area.dragover {
      border-color: #667eea;
      background: #ebf4ff;
    }
    
    .upload-icon {
      font-size: 48px;
      margin-bottom: 10px;
    }
    
    .upload-text {
      color: #4a5568;
      font-size: 16px;
      margin-bottom: 5px;
    }
    
    .upload-hint {
      color: #a0aec0;
      font-size: 12px;
    }
    
    input[type="file"] {
      display: none;
    }
    
    #results {
      display: none;
    }
    
    .result-section {
      margin-bottom: 25px;
      padding: 20px;
      border-radius: 8px;
      border-left: 4px solid #cbd5e0;
    }
    
    .result-section.success {
      background: #f0fff4;
      border-left-color: #48bb78;
    }
    
    .result-section.error {
      background: #fff5f5;
      border-left-color: #f56565;
    }
    
    .result-section.warning {
      background: #fffaf0;
      border-left-color: #ed8936;
    }
    
    .result-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .result-content {
      font-size: 14px;
      line-height: 1.6;
      color: #4a5568;
    }
    
    .sheet-info {
      background: #f7fafc;
      padding: 15px;
      border-radius: 6px;
      margin-top: 10px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
    }
    
    .sheet-name {
      font-weight: 600;
      color: #2d3748;
      margin-bottom: 8px;
    }
    
    .sheet-detail {
      color: #4a5568;
      padding-left: 15px;
      margin-bottom: 3px;
    }
    
    .summary {
      background: #ebf4ff;
      padding: 20px;
      border-radius: 8px;
      margin-top: 30px;
    }
    
    .summary-title {
      font-size: 18px;
      font-weight: 600;
      color: #2c5282;
      margin-bottom: 15px;
      text-align: center;
    }
    
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
    }
    
    .summary-item {
      background: white;
      padding: 15px;
      border-radius: 6px;
      text-align: center;
    }
    
    .summary-value {
      font-size: 32px;
      font-weight: 700;
      color: #2d3748;
      margin-bottom: 5px;
    }
    
    .summary-label {
      font-size: 12px;
      color: #718096;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .btn {
      display: inline-block;
      padding: 12px 24px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 20px;
    }
    
    .btn:hover {
      background: #5568d3;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }
    
    .error-list {
      list-style: none;
      padding: 0;
    }
    
    .error-item {
      padding: 8px 12px;
      background: white;
      border-radius: 4px;
      margin-bottom: 6px;
      font-size: 13px;
    }
    
    .sample-data {
      background: #1a202c;
      color: #e2e8f0;
      padding: 12px;
      border-radius: 6px;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      overflow-x: auto;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔍 Validador de Archivos XLSX</h1>
    <div class="subtitle">CIDI Auto-Notas - Verificación de Estructura</div>
    
    <div class="upload-area" id="uploadArea">
      <div class="upload-icon">📁</div>
      <div class="upload-text">Arrastra tu archivo aquí o haz click para seleccionar</div>
      <div class="upload-hint">Solo archivos .xlsx o .xlsm</div>
      <input type="file" id="fileInput" accept=".xlsx,.xlsm">
    </div>
    
    <div id="results"></div>
  </div>

  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
  <script>
    const uploadArea = document.getElementById('uploadArea');
    const fileInput = document.getElementById('fileInput');
    const results = document.getElementById('results');
    
    // Click para seleccionar archivo
    uploadArea.addEventListener('click', () => fileInput.click());
    
    // Drag & drop
    uploadArea.addEventListener('dragover', (e) => {
      e.preventDefault();
      uploadArea.classList.add('dragover');
    });
    
    uploadArea.addEventListener('dragleave', () => {
      uploadArea.classList.remove('dragover');
    });
    
    uploadArea.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadArea.classList.remove('dragover');
      
      const file = e.dataTransfer.files[0];
      if (file) processFile(file);
    });
    
    // Selección de archivo
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) processFile(file);
    });
    
    async function processFile(file) {
      console.log('📂 Procesando archivo:', file.name);
      
      if (!file.name.match(/\.(xlsx|xlsm)$/i)) {
        showError('Formato inválido. Solo se permiten archivos .xlsx o .xlsm');
        return;
      }
      
      try {
        const data = await file.arrayBuffer();
        const workbook = XLSX.read(data, { type: 'array' });
        
        validateWorkbook(workbook, file.name);
        
      } catch (error) {
        showError('Error leyendo el archivo: ' + error.message);
      }
    }
    
    function validateWorkbook(workbook, fileName) {
      console.log('🔍 Validando workbook...');
      
      const validation = {
        errors: [],
        warnings: [],
        info: [],
        sheets: []
      };
      
      // 1. Validar cantidad de hojas
      if (workbook.SheetNames.length === 0) {
        validation.errors.push('El archivo no contiene hojas');
      } else if (workbook.SheetNames.length === 1) {
        validation.info.push(`1 hoja (export por materia): "${workbook.SheetNames[0]}"`);
      } else if (workbook.SheetNames.length < 13) {
        validation.warnings.push(`Se encontraron ${workbook.SheetNames.length} hojas (formato multi-materia suele tener más).`);
      }
      
      validation.info.push(`Total de hojas: ${workbook.SheetNames.length}`);
      
      // 2. Validar cada hoja
      workbook.SheetNames.forEach((sheetName, index) => {
        const sheet = workbook.Sheets[sheetName];
        const sheetValidation = validateSheet(sheet, sheetName);
        validation.sheets.push(sheetValidation);
        
        validation.errors.push(...sheetValidation.errors.map(e => `[${sheetName}] ${e}`));
        validation.warnings.push(...sheetValidation.warnings.map(w => `[${sheetName}] ${w}`));
      });
      
      // 3. Mostrar resultados
      displayResults(validation, fileName, workbook);
    }
    
    function validateSheet(sheet, sheetName) {
      const validation = {
        name: sheetName,
        errors: [],
        warnings: [],
        info: {},
        sample: []
      };
      
      if (!sheet['!ref']) {
        validation.errors.push('Hoja vacía');
        return validation;
      }
      
      const range = XLSX.utils.decode_range(sheet['!ref']);
      const numCols = range.e.c - range.s.c + 1;
      const numRows = range.e.r - range.s.r + 1;
      
      validation.info.rows = numRows;
      validation.info.cols = numCols;
      
      // Validar cantidad de columnas (mínimo 21: Alumno + 20 notas)
      if (numCols < 21) {
        validation.warnings.push(`Solo ${numCols} columnas. Se esperan al menos 21 (Alumno + 20 evaluaciones).`);
      }

      // Encabezados en fila 7 (índice 6), igual que la extensión
      const HEADER_ROW = 6;
      const headers = [];
      for (let c = 0; c <= Math.min(range.e.c, 12); c++) {
        const cellAddress = XLSX.utils.encode_cell({ r: HEADER_ROW, c });
        const cell = sheet[cellAddress];
        headers.push(cell ? cell.v : '');
      }

      validation.info.headers = headers;
      validation.info.headerRow = HEADER_ROW + 1;

      const firstHeader = headers[0] ? headers[0].toString().toLowerCase() : '';
      const secondHeader = headers[1] ? headers[1].toString().toLowerCase() : '';
      const tieneDni = firstHeader.includes('dni');
      const tieneAlumno = firstHeader.includes('alumno') || firstHeader.includes('nombre');

      if (tieneDni) {
        validation.info.formato = 'DNI + Alumno (legacy)';
        if (!secondHeader.includes('alumno') && !secondHeader.includes('nombre')) {
          validation.warnings.push(`Con DNI, la segunda columna debería ser "Alumno". Encontrado: "${headers[1]}"`);
        }
      } else if (tieneAlumno) {
        validation.info.formato = 'Alumno sin DNI (PHP 2026)';
      } else {
        validation.errors.push(`Fila 7 no reconocida. Col A="${headers[0]}". Se espera "Alumno" o "DNI".`);
      }

      // Contar filas de estudiantes (desde fila 8)
      let studentRows = 0;
      for (let r = HEADER_ROW + 1; r <= range.e.r; r++) {
        const cellAddress = XLSX.utils.encode_cell({ r, c: 0 });
        const cell = sheet[cellAddress];
        const val = cell ? String(cell.v).trim() : '';
        if (!val) continue;
        if (/^instrucciones/i.test(val) || /^\d+\./.test(val)) break;
        studentRows++;
      }
      validation.info.studentRows = studentRows;

      if (studentRows === 0) {
        validation.errors.push('No se encontraron filas de estudiantes después de la fila 7');
      } else if (studentRows < 5) {
        validation.warnings.push(`Solo ${studentRows} estudiantes detectados`);
      }

      // Muestra: primeras 3 filas de datos
      for (let r = HEADER_ROW + 1; r <= Math.min(range.e.r, HEADER_ROW + 3); r++) {
        const row = [];
        for (let c = 0; c <= Math.min(range.e.c, 5); c++) {
          const cellAddress = XLSX.utils.encode_cell({ r, c });
          const cell = sheet[cellAddress];
          row.push(cell ? cell.v : '');
        }
        validation.sample.push(row);
      }

      if (tieneDni && validation.sample[0]) {
        const firstDNI = validation.sample[0][0];
        if (!firstDNI) {
          validation.warnings.push('Primera fila de datos sin DNI');
        } else {
          const dniStr = firstDNI.toString().replace(/[^\d]/g, '');
          if (dniStr.length < 7 || dniStr.length > 9) {
            validation.warnings.push(`DNI sospechoso: "${firstDNI}" (longitud: ${dniStr.length})`);
          }
        }
      }

      return validation;
    }
    
    function displayResults(validation, fileName, workbook) {
      let html = '';
      
      // Resumen general
      const totalErrors = validation.errors.length;
      const totalWarnings = validation.warnings.length;
      const totalSheets = workbook.SheetNames.length;
      const totalStudents = validation.sheets.reduce((sum, s) => sum + Math.max(0, s.info.rows - 1), 0);
      
      const status = totalErrors === 0 ? 'success' : 'error';
      const statusText = totalErrors === 0 ? '✅ VÁLIDO' : '❌ ERRORES ENCONTRADOS';
      
      html += `
        <div class="result-section ${status}">
          <div class="result-title">
            <span style="font-size: 24px;">${totalErrors === 0 ? '✅' : '❌'}</span>
            <span>Resultado: ${statusText}</span>
          </div>
          <div class="result-content">
            <strong>Archivo:</strong> ${fileName}<br>
            <strong>Errores:</strong> ${totalErrors}<br>
            <strong>Advertencias:</strong> ${totalWarnings}
          </div>
        </div>
      `;
      
      // Errores críticos
      if (totalErrors > 0) {
        html += `
          <div class="result-section error">
            <div class="result-title">❌ Errores Críticos (${totalErrors})</div>
            <div class="result-content">
              <ul class="error-list">
                ${validation.errors.map(e => `<li class="error-item">• ${e}</li>`).join('')}
              </ul>
            </div>
          </div>
        `;
      }
      
      // Advertencias
      if (totalWarnings > 0) {
        html += `
          <div class="result-section warning">
            <div class="result-title">⚠️ Advertencias (${totalWarnings})</div>
            <div class="result-content">
              <ul class="error-list">
                ${validation.warnings.map(w => `<li class="error-item">• ${w}</li>`).join('')}
              </ul>
            </div>
          </div>
        `;
      }
      
      // Información de hojas
      html += `
        <div class="result-section">
          <div class="result-title">📋 Hojas Encontradas (${totalSheets})</div>
          <div class="result-content">
            ${validation.sheets.map(s => `
              <div class="sheet-info">
                <div class="sheet-name">📄 ${s.name}</div>
                <div class="sheet-detail">📊 Dimensiones: ${s.info.rows} filas × ${s.info.cols} columnas</div>
                <div class="sheet-detail">📐 Formato: ${s.info.formato || '—'} (encabezados en fila ${s.info.headerRow || 7})</div>
                <div class="sheet-detail">👥 Estudiantes: ${s.info.studentRows ?? Math.max(0, s.info.rows - 7)}</div>
                <div class="sheet-detail">📋 Encabezados: ${(s.info.headers || []).slice(0, 6).join(' | ')}...</div>
                ${s.sample.length > 0 ? `
                  <div class="sample-data">
                    ${s.sample.map((row, i) => `Alumno ${i + 1}: ${row.slice(0, 4).join(' | ')}...`).join('<br>')}
                  </div>
                ` : ''}
              </div>
            `).join('')}
          </div>
        </div>
      `;
      
      // Resumen final
      html += `
        <div class="summary">
          <div class="summary-title">📊 Resumen Final</div>
          <div class="summary-grid">
            <div class="summary-item">
              <div class="summary-value">${totalSheets}</div>
              <div class="summary-label">Materias</div>
            </div>
            <div class="summary-item">
              <div class="summary-value">${totalStudents}</div>
              <div class="summary-label">Estudiantes</div>
            </div>
            <div class="summary-item">
              <div class="summary-value">${totalErrors}</div>
              <div class="summary-label">Errores</div>
            </div>
            <div class="summary-item">
              <div class="summary-value">${totalWarnings}</div>
              <div class="summary-label">Advertencias</div>
            </div>
          </div>
          
          ${totalErrors === 0 ? `
            <div style="text-align: center; margin-top: 20px; color: #2f855a; font-weight: 600;">
              ✅ El archivo está listo para usar en CIDI Auto-Notas
            </div>
          ` : `
            <div style="text-align: center; margin-top: 20px; color: #c53030; font-weight: 600;">
              ❌ Corrige los errores antes de usar el archivo
            </div>
          `}
          
          <button class="btn" onclick="location.reload()">🔄 Validar Otro Archivo</button>
        </div>
      `;
      
      results.innerHTML = html;
      results.style.display = 'block';
    }
    
    function showError(message) {
      results.innerHTML = `
        <div class="result-section error">
          <div class="result-title">❌ Error</div>
          <div class="result-content">${message}</div>
        </div>
        <button class="btn" onclick="location.reload()">🔄 Intentar de Nuevo</button>
      `;
      results.style.display = 'block';
    }
  </script>
</body>
</html>
