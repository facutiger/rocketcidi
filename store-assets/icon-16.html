<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Icon 16</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 16px;
      height: 16px;
      overflow: hidden;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .dot {
      width: 8px;
      height: 8px;
      background: #fff;
      border-radius: 2px;
      transform: rotate(45deg);
    }
  </style>
</head>
<body>
  <div class="dot"></div>
</body>
</html>
